name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.4)"
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG="${TAG#refs/tags/}"
          if [[ -z "${TAG}" ]]; then
            echo "Tag is empty" >&2
            exit 1
          fi
          if [[ "${TAG}" != v* ]]; then
            echo "Tag must start with v (got: ${TAG})" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          OUT_DIR="dist/${TAG}"
          if [[ "${TAG}" == *-* ]]; then
            STABLE="false"
          else
            STABLE="true"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "out_dir=${OUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "stable=${STABLE}" >> "$GITHUB_OUTPUT"

      - name: Preflight package signing secrets
        if: ${{ steps.meta.outputs.stable == 'true' }}
        shell: bash
        env:
          PACKAGE_GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_GPG_PRIVATE_KEY }}
          PACKAGE_GPG_PASSPHRASE: ${{ secrets.PACKAGE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${PACKAGE_GPG_PRIVATE_KEY}" || -z "${PACKAGE_GPG_PASSPHRASE}" ]]; then
            echo "Stable releases require PACKAGE_GPG_PRIVATE_KEY and PACKAGE_GPG_PASSPHRASE." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded relay binaries
        shell: bash
        run: |
          set -euo pipefail

          relay_dir="pkg/forwarding/relaybin"
          mkdir -p "${relay_dir}"

          targets=(
            "linux amd64"
            "linux arm64"
            "linux 386"
            "linux arm 6"
            "darwin amd64"
            "darwin arm64"
            "freebsd amd64"
          )

          for t in "${targets[@]}"; do
            read -r goos goarch goarm <<<"${t}"
            name="relay-${goos}-${goarch}"

            echo "Building ${name}"
            if [[ -n "${goarm:-}" ]]; then
              GOOS="${goos}" GOARCH="${goarch}" GOARM="${goarm}" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w" -o "${relay_dir}/${name}" ./cmd/relay
            else
              GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w" -o "${relay_dir}/${name}" ./cmd/relay
            fi

            gzip -9 -c "${relay_dir}/${name}" > "${relay_dir}/${name}.gz"
            rm -f "${relay_dir}/${name}"
          done

      - name: Test
        run: go test -v ./...

      - name: Generate Windows manifest resource
        shell: bash
        run: |
          go install github.com/akavel/rsrc@latest
          # Generate per-arch .syso so the linker picks up the correct one
          # (avoids "unknown ARM64 relocation type" when a single .syso is
          # linked into a mismatched GOARCH build).
          rsrc -manifest flyssh.manifest -arch amd64 -o rsrc_windows_amd64.syso
          rsrc -manifest flyssh.manifest -arch arm64 -o rsrc_windows_arm64.syso

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.meta.outputs.version }}"
          out_dir="${{ steps.meta.outputs.out_dir }}"
          mkdir -p "${out_dir}"

          ldflags="-s -w -X main.Version=${version}"

          targets=(
            "windows amd64 exe"
            "windows arm64 exe"
            "linux amd64"
            "linux arm64"
            "linux 386"
            "linux arm 6"
            "darwin amd64"
            "darwin arm64"
            "freebsd amd64"
          )

          for t in "${targets[@]}"; do
            read -r goos goarch ext goarm <<<"${t}"
            ext="${ext:-}"

            name="flyssh-${version}-${goos}-${goarch}"
            bin_path="${out_dir}/${name}"
            if [[ "${ext}" == "exe" ]]; then
              bin_path="${bin_path}.exe"
            fi

            echo "Building ${bin_path}"
            if [[ -n "${goarm:-}" ]]; then
              GOOS="${goos}" GOARCH="${goarch}" GOARM="${goarm}" CGO_ENABLED=0 \
                go build -trimpath -ldflags "${ldflags}" -o "${bin_path}" .
            else
              GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
                go build -trimpath -ldflags "${ldflags}" -o "${bin_path}" .
            fi

            if [[ "${goos}" == "windows" ]]; then
              (cd "${out_dir}" && zip -q "${name}.exe.zip" "${name}.exe")
              rm -f "${bin_path}"
            else
              (cd "${out_dir}" && tar -czf "${name}.tar.gz" "${name}")
              rm -f "${bin_path}"
            fi
          done

      - name: Install Linux packaging tools
        if: ${{ steps.meta.outputs.stable == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c dpkg-dev gnupg rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Linux packages
        if: ${{ steps.meta.outputs.stable == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/build_linux_packages.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --out-dir "${{ steps.meta.outputs.out_dir }}"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "${{ steps.meta.outputs.out_dir }}"
            sha256sum * > checksums.txt
          )

      - name: Prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.meta.outputs.version }}"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          version = os.environ["VERSION"]
          header = f"## v{version}"
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()

          start = None
          for i, line in enumerate(lines):
              if line == header or line.startswith(header + " "):
                  start = i
                  break

          if start is None:
              sys.stderr.write(f"No changelog section found for {header}\n")
              sys.exit(1)

          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i].startswith("## "):
                  end = i
                  break

          body = "\n".join(lines[start:end]).strip() + "\n"
          Path("RELEASE_NOTES.md").write_text(body, encoding="utf-8")
          PY

          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "No changelog section found for ## v${version}" >&2
            exit 1
          fi
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          fail_on_unmatched_files: true
          files: ${{ steps.meta.outputs.out_dir }}/*
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}

      - name: Checkout main for package manifests
        if: ${{ steps.meta.outputs.stable == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: main
          path: manifest-main

      - name: Update package manifests
        if: ${{ steps.meta.outputs.stable == 'true' }}
        shell: bash
        working-directory: manifest-main
        run: |
          set -euo pipefail

          cp "${GITHUB_WORKSPACE}/${{ steps.meta.outputs.out_dir }}/checksums.txt" "${RUNNER_TEMP}/checksums.txt"

          python3 "${GITHUB_WORKSPACE}/.github/scripts/update_package_manifests.py" \
            --version "${{ steps.meta.outputs.version }}" \
            --checksums "${RUNNER_TEMP}/checksums.txt"

          ruby -c Formula/flyssh.rb
          python3 -m json.tool bucket/flyssh.json >/dev/null

          if git diff --quiet -- Formula/flyssh.rb bucket/flyssh.json; then
            echo "Package manifests are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flyssh.rb bucket/flyssh.json
          git commit -m "chore: update package manifests for ${{ steps.meta.outputs.tag }}"
          git push origin HEAD:main

      - name: Prepare package repository worktree
        if: ${{ steps.meta.outputs.stable == 'true' }}
        id: package_pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_dir="${RUNNER_TEMP}/flyssh-package-pages"
          rm -rf "${pages_dir}"
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${pages_dir}"
          cd "${pages_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          echo "dir=${pages_dir}" >> "$GITHUB_OUTPUT"

      - name: Update Linux package repositories
        if: ${{ steps.meta.outputs.stable == 'true' }}
        shell: bash
        env:
          PACKAGE_GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_GPG_PRIVATE_KEY }}
          PACKAGE_GPG_PASSPHRASE: ${{ secrets.PACKAGE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          .github/scripts/update_linux_repos.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --artifacts "${{ steps.meta.outputs.out_dir }}" \
            --pages-dir "${{ steps.package_pages.outputs.dir }}"

      - name: Publish Linux package repositories
        if: ${{ steps.meta.outputs.stable == 'true' }}
        shell: bash
        working-directory: ${{ steps.package_pages.outputs.dir }}
        run: |
          set -euo pipefail
          if git status --porcelain | grep . >/dev/null; then
            git add -A
            git commit -m "chore: update Linux package repositories for ${{ steps.meta.outputs.tag }}"
            git push origin HEAD:gh-pages
          else
            echo "Linux package repositories are already up to date."
          fi

      - name: Ensure GitHub Pages is enabled
        if: ${{ steps.meta.outputs.stable == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is already enabled."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
          fi
