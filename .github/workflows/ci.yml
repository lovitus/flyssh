name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded relay binaries (required by go:embed tests)
        shell: bash
        run: |
          set -euo pipefail
          relay_dir="pkg/forwarding/relaybin"
          mkdir -p "${relay_dir}"
          targets=(
            "linux amd64"
            "linux arm64"
            "linux 386"
            "linux arm 6"
            "darwin amd64"
            "darwin arm64"
            "freebsd amd64"
          )
          for t in "${targets[@]}"; do
            read -r goos goarch goarm <<<"${t}"
            name="relay-${goos}-${goarch}"
            if [[ -n "${goarm:-}" ]]; then
              GOOS="${goos}" GOARCH="${goarch}" GOARM="${goarm}" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w" -o "${relay_dir}/${name}" ./cmd/relay
            else
              GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w" -o "${relay_dir}/${name}" ./cmd/relay
            fi
            gzip -9 -c "${relay_dir}/${name}" > "${relay_dir}/${name}.gz"
            rm -f "${relay_dir}/${name}"
          done

      - name: Test suite
        run: go test ./...

      - name: Reconnect and forwarding end-to-end
        env:
          FLYSSH_E2E: "1"
        run: go test ./e2e -count=1 -v -timeout 9m

      - name: GUI gateway network recovery
        shell: bash
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/flyssh-recovery" .
          FLYSSH_RECOVERY_BIN="${RUNNER_TEMP}/flyssh-recovery" go test ./e2e -run '^TestGUIGatewayEndpointSurvivesNetworkFailure$' -count=1 -v -timeout 90s

      - name: Race detector
        run: go test -race ./...

      - name: Repeat stability check
        run: go test ./... -count=5

  windows-transfers:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: rsync
      - name: Build and exercise Windows GUI transfers
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p pkg/forwarding/relaybin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/relay" ./cmd/relay
          gzip -c "$RUNNER_TEMP/relay" > pkg/forwarding/relaybin/relay-linux-amd64.gz
          go build -o "$RUNNER_TEMP/flyssh-recovery.exe" .
          FLYSSH_RECOVERY_BIN="$RUNNER_TEMP/flyssh-recovery.exe" go test ./pkg/wingui -count=1 -v -timeout 4m
