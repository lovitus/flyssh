name: Apply GUI integration patch
on:
  push:
    branches: [codex/gui-file-hashes]
    paths: [.github/patches/gui-file-hashes.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add the release changelog
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CHANGELOG.md)" = f44bf7312d9e5f18df967d2ea33154ffea4cb69c
          git apply --check .github/patches/gui-file-hashes.patch
          git apply .github/patches/gui-file-hashes.patch
          python3 -m py_compile .github/scripts/request_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: record file hashing and release verification for v2.0.15'
          git push origin HEAD:codex/gui-file-hashes
